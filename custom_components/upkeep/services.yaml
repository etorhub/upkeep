  name: Remove Task
  description: >
    Delete a maintenance task and its entity. Provide entity_id or task_id.
    The response includes task_id and entity_id.
  fields:
    entity_id:
      name: Entity ID
      description: The task entity to delete. Required when task_id is omitted.
      required: false
      selector:
        entity:
          domain: binary_sensor
    task_id:
      name: Task ID
      description: The Upkeep task id (the entity's unique id). Required when entity_id is omitted.
      required: false
      example: upkeep_0123456789abcdef
      selector:
        text:
