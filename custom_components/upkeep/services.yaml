            - frequency
    interval_value:
      name: Interval Value
      required: false
      selector:
        number:
          min: 1
          mode: box
    interval_type:
      name: Interval Type
      required: false
      selector:
        select:
          options:
            - days
            - weeks
            - months
    last_performed:
      name: Last Performed
      required: false
      selector:
        text:
    tag_id:
      name: Tag ID
      required: false
      selector:
        text:
    icon:
      name: Icon
      required: false
      selector:
        icon:
    assigned_user:
      name: Assigned User
      required: false
      selector:
        text:
    frequency_target:
      name: Frequency Target
      required: false
      selector:
        number:
          min: 1
          mode: box
    current_count:
      name: Current Count
      required: false
      selector:
        number:
          min: 0
          mode: box
    watched_entity:
      name: Watched Entity
      required: false
      selector:
        entity:
    enabled:
      name: Enabled
      required: false
      selector:
        boolean:
    snoozed_until:
      name: Snoozed Until
      required: false
      selector:
        text:
    notify_when_due:
      name: Notify When Due
      required: false
      selector:
        boolean:
    notify_before:
      name: Notify Before Due
      required: false
      selector:
        boolean:
    notify_before_value:
      name: Notify Lead
      required: false
      selector:
        number:
          min: 1
          mode: box
    notify_before_unit:
      name: Notify Lead Unit
      required: false
      selector:
        select:
          options:
            - days
            - weeks
            - months
    notify_service:
      name: Notify Service
      required: false
      selector:
        text:
    labels:
      name: Labels
      required: false
      selector:
        text:
          multiple: true

