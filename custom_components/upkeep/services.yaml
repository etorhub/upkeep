      description: The task entity to update. Required when task_id is omitted.
      required: false
      selector:
        entity:
          domain: binary_sensor
    task_id:
      name: Task ID
      description: The Upkeep task id (the entity's unique id). Required when entity_id is omitted.
      required: false
      example: upkeep_0123456789abcdef
      selector:
        text:
    title:
      name: Title
      required: false
      selector:
        text:
    description:
      name: Description
      description: Pass an empty value to clear the description.
      required: false
      selector:
        text:
    task_type:
